# Tox configuration for Regex Lab
# Test on Python 3.8 (current ST4) and 3.13 (future ST4)

[tox]
envlist = py38-core, py313-core, lint, typecheck
requires = tox-uv
# Keep tox environments outside the project tree (under TEMP when it is set)
toxworkdir = {env:TEMP:temp}/tox-regexlab

[testenv]
extras = dev
pass_env = USERNAME
uv_python_preference = only-managed
commands =
    pytest tests/ --cov=src --cov-report=term-missing --cov-report=html

# Core tests only (no UI/Sublime integration tests)
[testenv:py38-core]
description = Test core logic only (no Sublime Text UI - headless)
extras = dev
commands =
    pytest {posargs:tests/} --cov=src --cov-config=.coveragerc-core --cov-report=term-missing --cov-report=html -m "not integration"

[testenv:py313-core]
description = Test core logic only (no Sublime Text UI - headless)
extras = dev
commands =
    pytest {posargs:tests/} --cov=src --cov-config=.coveragerc-core --cov-report=term-missing --cov-report=html -m "not integration"

[testenv:lint]
basepython = python3.8
extras = dev
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typecheck]
basepython = python3.8
extras = dev
commands =
    mypy src/ --ignore-missing-imports --strict --no-warn-unused-ignores
