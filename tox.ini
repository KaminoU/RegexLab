# Tox configuration for Regex Lab
# Test on Python 3.8 and 3.14: Sublime Text 4 runs plugins under 3.8 before build 4213, under 3.14 from build 4213 on

[tox]
envlist = py38-core, py314-core, lint, typecheck
requires = tox-uv
# Keep tox environments outside the project tree (under TEMP when it is set)
toxworkdir = {env:TEMP:temp}/tox-regexlab

[testenv]
extras = dev
pass_env = USERNAME
uv_python_preference = only-managed
commands =
    pytest tests/ --cov --cov-report=term-missing --cov-report=html

# Core tests only (no UI/Sublime integration tests)
[testenv:py38-core]
description = Test core logic only (no Sublime Text UI - headless)
extras = dev
commands =
    pytest tests/ --cov --cov-report=term-missing --cov-report=html --cov-report=json:{env_tmp_dir}/coverage.json -m "not integration"
    python -m tools.coverage_gate.check {env_tmp_dir}/coverage.json tools/coverage_gate/ceilings.json

[testenv:py314-core]
description = Test core logic only (no Sublime Text UI - headless)
extras = dev
commands =
    pytest tests/ --cov --cov-report=term-missing --cov-report=html --cov-report=json:{env_tmp_dir}/coverage.json -m "not integration"
    python -m tools.coverage_gate.check {env_tmp_dir}/coverage.json tools/coverage_gate/ceilings.json

[testenv:lint]
basepython = python3.8
extras = dev
commands =
    ruff check src/ tests/ tools/ RegexLab.py
    ruff format --check src/ tests/ tools/ RegexLab.py

[testenv:typecheck]
basepython = python3.8
extras = dev
commands =
    mypy src/ tools/ --ignore-missing-imports --strict --no-warn-unused-ignores
