name: CI

on:
  push:
    branches: [main, RC]
  pull_request:
    branches: [main, RC]

# bash stops a run step at its first failing command (-e -o pipefail) on every OS; under pwsh, the Windows default,
# a step reports only the exit code of its last command.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: pip install ".[dev]"

      # Guardrail: keep Ruff upfront so import/format regressions fail fast on every PR.
      - name: Run Ruff linter
        run: ruff check src/ tests/ tools/ RegexLab.py --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/ tools/ RegexLab.py

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run mypy
        run: mypy src/ tools/ --ignore-missing-imports --strict --no-warn-unused-ignores

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        python-version: ["3.8", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install ".[dev]"

      - name: Run tests
        run: pytest tests/ --cov --cov-report=term-missing --cov-report=html --cov-report=json:coverage.json -m "not integration"

      - name: Check coverage ceilings
        run: python -m tools.coverage_gate.check coverage.json tools/coverage_gate/ceilings.json

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: coverage.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Some checks did not succeed"
            exit 1
          else
            echo "✅ All checks passed!"
          fi
